<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1><marquee behavior="alternate">Daily board</marquee></h1>
    </header>
    <main id="app"></main>
 
    <h3>Tambah Mata pelajaran</h3>
    <input id="namaTugas" type="text">
    <button id="tambah">Tambah</button>

    <h3>daftar tugas</h3>
    <ul id="daftar-tugas"></ul>
    <button id="filter-semua">Semua</button>
    <button id="filter-selesai">Selesai</button>
    <button id="filter-belum">Belum</button>
<br>
    <input id="cari-tugas" type="text" placeholder="Cari tugas...">
    
    <br>
    <hr>
    <textarea id="isiCatatan"></textarea>
    <button id="tambahCatatan">Tambah Tugas</button>

    <h3>catatan</h3>
    <div id="daftar-catatan"></div>
    <br>
    <h3>Kutipan </h3>
    <div id="kutipan-harian"></div>

    <input id="namaKota" type="text">
    <button id="cariCuaca">Cari Cuaca</button>

    <div id="info-cuaca"></div>

    <div id="status"></div>

    <br>

    <button id="toggle-tema">Dark Mode</button>
