<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  
    <header>
        <h1><marquee behavior="alternate">Daily board</marquee></h1>
    </header>
    <main id="app"></main>

   <table border="1" cellspacing="5">
    <tr>
        <td width="50%">
    <h3>Tambah tugas</h3>
    <input id="namaTugas" type="text">
    <button id="tambah">Tambah</button>

    <h3>daftar tugas</h3>
    <ul id="daftar-tugas"></ul>
    <button id="filter-semua">Semua</button>
    <button id="filter-selesai">Selesai</button>
    <button id="filter-belum">Belum</button>
<br>
    <input id="cari-tugas" type="text" placeholder="Cari tugas...">
        </td>
   
        <td width="50%">
    <h3>Tambah Catatan</h3>
    <textarea id="isiCatatan"></textarea>
    <button id="tambahCatatan">Tambah Catatan</button>

    <h3>Daftar catatan</h3>
    <div id="daftar-catatan"></div>
        </td>
    </tr>
</table>

<table border="1" cellspacing="2">
    <tr>
        <td width="50%">
    <h3>Kutipan </h3>
    <div id="kutipan-harian"></div>
    <button id="refresh-kutipan">Refresh</button>
        </td>

        
   
    <td width="50%">
    <div id="info-cuaca"></div>

    <div id="status"></div>
    
    
    <input id="namaKota" type="text">
    <button id="cariCuaca">Cari Cuaca</button>
        </td>
    </tr>
    </table>

    <center>
        
    <button id="toggle-tema">Dark Mode</button>
      
    </center>


   <script type="module" src="script.js"></script>
</body>
</html>
